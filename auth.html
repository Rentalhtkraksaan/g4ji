<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - Portal Pelatih Official</title>
    
    <!-- Security Guard -->
    <script src="security-guard.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="auth-box glass-card" style="margin-top: 40px;">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="display:inline-flex; background:rgba(59, 130, 246, 0.15); padding:16px; border-radius:20px; border:1px solid rgba(59, 130, 246, 0.3); color:var(--primary); margin-bottom:12px;">
                    <i class="fa-solid fa-user-ninja fa-2x"></i>
                </div>
                <h2 style="font-weight: 800; font-size: 22px;">Portal Pelatih Official</h2>
                <p style="color: var(--text-secondary); font-size: 13px;">Masuk ke akun Anda untuk melihat jadwal mengajar & pencairan honor</p>
            </div>

            <!-- VIEW FORM LOGIN -->
            <div id="viewLogin">
                <form onsubmit="handleLoginUser(event)">
                    <div class="form-group">
                        <label><i class="fa-solid fa-phone"></i> Nomor HP (Sebagai Akun)</label>
                        <input type="tel" id="loginNoHp" class="form-control" placeholder="Contoh: 085176871609" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-key"></i> Tanggal Lahir (Sebagai PW: DDMMYY)</label>
                        <input type="password" id="loginTglLahir" class="form-control" placeholder="Contoh: 160905 (16 Sep 2005)" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn-submit-form"><i class="fa-solid fa-right-to-bracket"></i> MASUK KE PORTAL</button>
                </form>

                <!-- TOMBOL DAFTAR DI BAWAH TAMPILAN LOGIN -->
                <div style="margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--border-color); text-align: center;">
                    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">Belum memiliki akun pelatih?</p>
                    <button type="button" onclick="showRegisterView()" class="btn-submit-form" style="background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); margin-top: 0;">
                        <i class="fa-solid fa-user-plus"></i> BUAT AKUN BARU
                    </button>
                </div>
            </div>

            <!-- VIEW FORM DAFTAR (BUAT AKUN) -->
            <div id="viewRegister" style="display: none;">
                <div style="margin-bottom: 16px;">
                    <h3 style="font-size: 16px; font-weight: 700; color: #34d399;"><i class="fa-solid fa-user-plus"></i> Form Pendaftaran Pelatih Baru</h3>
                </div>
                <form onsubmit="handleRegisterUser(event)">
                    <div class="form-group">
                        <label><i class="fa-solid fa-user"></i> Nama Lengkap Pelatih</label>
                        <input type="text" id="regNama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-phone"></i> Nomor HP (Sebagai Akun)</label>
                        <input type="tel" id="regNoHp" class="form-control" placeholder="Contoh: 085176871609" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-calendar-day"></i> Tanggal Lahir (Sebagai Password: DDMMYY)</label>
                        <input type="text" id="regTglLahir" class="form-control" placeholder="Contoh: 160905" maxlength="6" required>
                        <small style="color:var(--text-muted); font-size:11px; display:block; margin-top:4px;">💡 Contoh lahir 16 September 2005: ketik <strong>160905</strong></small>
                    </div>
                    <button type="submit" class="btn-submit-form" style="background:var(--accent-emerald); color:#000;"><i class="fa-solid fa-check-circle"></i> DAFTARKAN AKUN SEKARANG</button>
                </form>

                <div style="margin-top: 16px; text-align: center;">
                    <button type="button" onclick="showLoginView()" style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 600;">
                        <i class="fa-solid fa-arrow-left"></i> Kembali ke Tampilan Login
                    </button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <p style="font-size: 11px; color: var(--text-muted);"><i class="fa-solid fa-shield-cat"></i> Keamanan Berlapis Host Guard & Realtime DB Active</p>
            </div>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script src="app.js"></script>
    <script>
        function showRegisterView() {
            document.getElementById("viewLogin").style.display = "none";
            document.getElementById("viewRegister").style.display = "block";
        }

        function showLoginView() {
            document.getElementById("viewRegister").style.display = "none";
            document.getElementById("viewLogin").style.display = "block";
        }

        function handleLoginUser(e) {
            e.preventDefault();
            const hp = document.getElementById("loginNoHp").value;
            const pw = document.getElementById("loginTglLahir").value;
            loginPelatih(hp, pw);
        }

        function handleRegisterUser(e) {
            e.preventDefault();
            const nama = document.getElementById("regNama").value;
            const hp = document.getElementById("regNoHp").value;
            const pw = document.getElementById("regTglLahir").value;
            registerPelatih(nama, hp, pw);
        }
    </script>
</body>
</html>
